,

      <button class="open-button" onclick="openAnother()">

<script>

   simply leave image as "".

   Example:

     text: "I miss you so much!",

  /* 5. FEEL LIKE TALKING */

/* =====================================================
   DON'T CHANGE ANYTHING BELOW THIS LINE
   ===================================================== */

let currentJar = 0;
let remainingNotes = [];


function openJar(number) {

  currentJar = number;

  document.getElementById("home").classList.remove("active");
  document.getElementById("notes").classList.add("active");

  document.getElementById("jarHeading").textContent =
    jars[number].title;

  remainingNotes = [...jars[number].notes];

  openAnother();
}


function openAnother() {

  if (remainingNotes.length === 0) {
    remainingNotes = [...jars[currentJar].notes];
  }

  const randomIndex =
    Math.floor(Math.random() * remainingNotes.length);

  const chosen =
    remainingNotes.splice(randomIndex, 1)[0];

  document.getElementById("noteText").textContent =
    chosen.text;

  const image =
    document.getElementById("noteImage");

  if (chosen.image && chosen.image !== "") {

    image.src = chosen.image;
    image.style.display = "block";

    image.onerror = function() {
      image.style.display = "none";
    };

  } else {

    image.style.display = "none";
    image.removeAttribute("src");

  }

  document.querySelector(".note").style.animation = "none";

  setTimeout(function() {
    document.querySelector(".note").style.animation =
      "appear 0.35s ease";
  }, 10);
}


function goHome() {

  document.getElementById("notes").classList.remove("active");
  document.getElementById("home").classList.add("active");

}

</script>
